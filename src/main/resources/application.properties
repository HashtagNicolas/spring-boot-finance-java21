# Nom de l'application (apparait dans les logs et les métriques)
spring.application.name=bank

# Base de données H2 embarquée en mémoire (uniquement pour ce squelette de
# développement ; une base persistante sera introduite plus tard)
spring.datasource.url=jdbc:h2:mem:bank;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Génère le schéma à partir des entités JPA à chaque démarrage : pratique
# pour ce squelette, à remplacer par des migrations (Flyway/Liquibase) plus tard
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Console web H2, utile en développement pour inspecter les données
spring.h2.console.enabled=true
